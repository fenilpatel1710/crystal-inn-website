name: Verify Cloudflare production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install dependencies
        run: bun install
      - name: Build Next.js for Cloudflare Workers
        run: bun run build:cloudflare
      - name: Record build result on the GitHub commit
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          if [ "$BUILD_RESULT" = "success" ]; then result=success; else result=failure; fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$result" -f context="cloudflare-build-check" -f description="GitHub Actions Cloudflare production build: $BUILD_RESULT"
