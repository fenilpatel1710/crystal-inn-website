name: Website build validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  nextjs-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and compile
        run: npm run build
